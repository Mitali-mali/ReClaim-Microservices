
services:
  mongodb:
    image: mongo:6
    container_name: reclaim_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build: ./api-gateway
    container_name: reclaim_api_gateway
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - AUTH_SERVICE_URL=http://auth-service:5001
      - ITEM_SERVICE_URL=http://item-service:5002
      - MATCHING_SERVICE_URL=http://matching-service:5003
      - CLAIM_SERVICE_URL=http://claim-service:5004
      - NOTIFICATION_SERVICE_URL=http://notification-service:5005
    depends_on:
      - auth-service
      - item-service
      - matching-service
      - claim-service
      - notification-service

  auth-service:
    build: ./services/auth-service
    container_name: reclaim_auth_service
    environment:
      - AUTH_SERVICE_PORT=5001
      - MONGO_URI_AUTH=mongodb://mongodb:27017/reclaim_auth
      - JWT_SECRET=super_secret_development_key
    depends_on:
      mongodb:
        condition: service_healthy

  item-service:
    build: ./services/item-service
    container_name: reclaim_item_service
    environment:
      - ITEM_SERVICE_PORT=5002
      - MONGO_URI_ITEM=mongodb://mongodb:27017/reclaim_item
      - JWT_SECRET=super_secret_development_key
    depends_on:
      mongodb:
        condition: service_healthy

  matching-service:
    build: ./services/matching-service
    container_name: reclaim_matching_service
    environment:
      - MATCHING_SERVICE_PORT=5003
      - MONGO_URI_MATCHING=mongodb://mongodb:27017/reclaim_matching
      - ITEM_SERVICE_URL=http://item-service:5002
    depends_on:
      mongodb:
        condition: service_healthy

  claim-service:
    build: ./services/claim-service
    container_name: reclaim_claim_service
    environment:
      - CLAIM_SERVICE_PORT=5004
      - MONGO_URI_CLAIM=mongodb://mongodb:27017/reclaim_claim
      - JWT_SECRET=super_secret_development_key
      - ITEM_SERVICE_URL=http://item-service:5002
      - NOTIFICATION_SERVICE_URL=http://notification-service:5005
    depends_on:
      mongodb:
        condition: service_healthy

  notification-service:
    build: ./services/notification-service
    container_name: reclaim_notification_service
    environment:
      - NOTIFICATION_SERVICE_PORT=5005
      - MONGO_URI_NOTIFICATION=mongodb://mongodb:27017/reclaim_notification
      - JWT_SECRET=super_secret_development_key
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: reclaim_frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway

volumes:
  mongo_data:
