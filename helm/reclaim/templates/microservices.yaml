{{- range $key, $svc := .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svc.name }}
  labels:
    app: {{ $svc.name }}
    {{- include "reclaim.labels" $ | nindent 4 }}
spec:
  replicas: {{ $.Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ $svc.name }}
  template:
    metadata:
      labels:
        app: {{ $svc.name }}
    spec:
      containers:
      - name: {{ $svc.name }}
        image: "{{ $.Values.image.repositoryPrefix }}-{{ $svc.name }}:{{ $.Values.image.tag }}"
        imagePullPolicy: {{ $.Values.image.pullPolicy }}
        ports:
        - containerPort: {{ $svc.port }}
        envFrom:
        - configMapRef:
            name: {{ include "reclaim.name" $ }}-config
        - secretRef:
            name: {{ include "reclaim.name" $ }}-secret
        livenessProbe:
          httpGet:
            path: /health
            port: {{ $svc.port }}
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: {{ $svc.port }}
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          {{- toYaml $.Values.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc.name }}
  labels:
    app: {{ $svc.name }}
    {{- include "reclaim.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - port: {{ $svc.port }}
    targetPort: {{ $svc.port }}
  selector:
    app: {{ $svc.name }}
---
{{- end }}
