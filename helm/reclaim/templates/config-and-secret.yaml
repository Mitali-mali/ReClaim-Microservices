apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "reclaim.name" . }}-config
  labels:
    {{- include "reclaim.labels" . | nindent 4 }}
data:
  PORT: "{{ .Values.gateway.port }}"
  AUTH_SERVICE_PORT: "{{ .Values.services.auth.port }}"
  ITEM_SERVICE_PORT: "{{ .Values.services.item.port }}"
  MATCHING_SERVICE_PORT: "{{ .Values.services.matching.port }}"
  CLAIM_SERVICE_PORT: "{{ .Values.services.claim.port }}"
  NOTIFICATION_SERVICE_PORT: "{{ .Values.services.notification.port }}"
  AUTH_SERVICE_URL: "http://{{ .Values.services.auth.name }}:{{ .Values.services.auth.port }}"
  ITEM_SERVICE_URL: "http://{{ .Values.services.item.name }}:{{ .Values.services.item.port }}"
  MATCHING_SERVICE_URL: "http://{{ .Values.services.matching.name }}:{{ .Values.services.matching.port }}"
  CLAIM_SERVICE_URL: "http://{{ .Values.services.claim.name }}:{{ .Values.services.claim.port }}"
  NOTIFICATION_SERVICE_URL: "http://{{ .Values.services.notification.name }}:{{ .Values.services.notification.port }}"
  MONGO_URI_AUTH: "mongodb://mongodb-service:{{ .Values.mongodb.port }}/reclaim_auth"
  MONGO_URI_ITEM: "mongodb://mongodb-service:{{ .Values.mongodb.port }}/reclaim_item"
  MONGO_URI_MATCHING: "mongodb://mongodb-service:{{ .Values.mongodb.port }}/reclaim_matching"
  MONGO_URI_CLAIM: "mongodb://mongodb-service:{{ .Values.mongodb.port }}/reclaim_claim"
  MONGO_URI_NOTIFICATION: "mongodb://mongodb-service:{{ .Values.mongodb.port }}/reclaim_notification"
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "reclaim.name" . }}-secret
  labels:
    {{- include "reclaim.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.jwt.secret | quote }}
